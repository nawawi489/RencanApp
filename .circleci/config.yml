version: 2.1

# CI RencanApp — port dari .github/workflows/ci.yml + deploy-staging.yml.
# Alasan pindah: GitHub Actions personal quota 2000 min/bulan tembus dengan pola
# usage bulan ini. CircleCI free tier personal ~6000 min/bulan (Linux), memberi
# margin luas selama optimasi CI yang sudah landed masih berlaku.
#
# Yang di-port:
#   - quality        (lint + type-check + jest)     ← docker executor (murah)
#   - rename-guard   (no-old-names.sh scanner)      ← docker executor
#   - db-contract    (supabase start + contract SQL) ← machine executor (butuh Docker)
#   - deploy-staging (expo export + eas deploy)      ← docker executor, staging-only
#
# Yang TIDAK di-port (di-cut sengaja saat optimasi CI):
#   - `changes` job (path-filter internal): CircleCI tidak punya `outputs`
#     lintas job cara GH Actions. Untuk simplicity, semua job jalan setiap
#     commit — quota masih besar. Kalau perlu, tambahkan `path-filtering` orb
#     nanti.
#   - deploy-staging quality/db-contract re-run: sudah sebagai gate PR.

orbs:
  node: circleci/node@5.3.0

executors:
  node22:
    docker:
      - image: cimg/node:22.11.0
    working_directory: ~/repo/mobile
  node22-root:
    docker:
      - image: cimg/node:22.11.0
    working_directory: ~/repo
  ubuntu-machine:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/repo

commands:
  checkout-and-install:
    description: "Checkout repo dan install deps mobile/ dengan cache"
    steps:
      - checkout:
          path: ~/repo
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "package-lock.json" }}
            - v1-npm-
      - run:
          name: Install dependencies
          # npm install (bukan npm ci) — Expo/RN punya optional dep wasm yang
          # resolusinya berbeda antar-OS; lock dari Windows tidak lolos `npm ci`
          # strict di Linux. Sesuai catatan di ci.yml lama.
          command: npm install --no-audit --no-fund
      - save_cache:
          paths:
            - node_modules
          key: v1-npm-{{ checksum "package-lock.json" }}

jobs:
  quality:
    executor: node22
    steps:
      - checkout-and-install
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Type-check
          command: npm run type-check
      - run:
          name: Test
          command: npm run test:ci

  rename-guard:
    executor: node22-root
    steps:
      - checkout
      - run:
          name: Install ripgrep
          command: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - run:
          name: Grep-guard legacy identifiers
          # Scanner memantau `wiki/`, `specs/`, `DESIGN.md` untuk regresi
          # rename V1.8.3 (kpi_area_id, kpi_areas, action_plan_instances, etc.).
          command: bash scripts/ci/no-old-names.sh

  db-contract:
    executor: ubuntu-machine
    steps:
      - checkout
      - run:
          name: Install Supabase CLI
          # Sejak v2 Supabase CLI ship SEBAGAI DUA binary co-located:
          #   - `supabase` (shim, forwards)
          #   - `supabase-go` (actual Go CLI)
          # Shim mencari supabase-go di $SUPABASE_GO_BINARY atau di
          # `/usr/local/bin/supabase-go`. Kalau cuma satu yang di-move,
          # shim error "Could not find the supabase-go binary".
          #
          # Extract ke direktori sendiri (bukan working_directory ~/repo yang
          # sudah ada folder `supabase/` untuk migrations), lalu install
          # keduanya ke /usr/local/bin agar shim ketemu backend-nya.
          command: |
            SUPABASE_VERSION=2.109.1
            EXTRACT_DIR=/tmp/supabase-cli
            mkdir -p "$EXTRACT_DIR"
            wget -qO- "https://github.com/supabase/cli/releases/download/v${SUPABASE_VERSION}/supabase_linux_amd64.tar.gz" | tar xz -C "$EXTRACT_DIR"
            sudo install -m 0755 "$EXTRACT_DIR/supabase" /usr/local/bin/supabase
            sudo install -m 0755 "$EXTRACT_DIR/supabase-go" /usr/local/bin/supabase-go
            supabase --version
      - run:
          name: Install psql client
          command: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - run:
          name: Start Supabase stack
          # `supabase start` boots Postgres + auth schema dan apply semua
          # migrations di supabase/migrations/ secara urut. Kontrak DB di
          # supabase/tests/*.sql dieksekusi oleh runner script.
          command: supabase start
      - run:
          name: Run DB contract suite
          environment:
            DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          command: bash scripts/ci/run-db-contract-tests.sh
      - run:
          name: Stop Supabase stack
          command: supabase stop --no-backup
          when: always

  deploy-staging:
    executor: node22
    environment:
      EXPO_PUBLIC_APP_ENV: staging
    steps:
      - checkout-and-install
      - run:
          name: Install EAS CLI
          command: sudo npm install -g eas-cli
      - run:
          # STAGING_SUPABASE_URL + STAGING_SUPABASE_ANON_KEY di-set di CircleCI
          # project env vars (Settings → Environment Variables).
          #
          # PENETAPAN ADA DI `command:`, BUKAN DI BLOK `environment:`. CircleCI
          # memperlakukan nilai pada `environment:` sebagai string LITERAL — tidak ada
          # ekspansi shell — sehingga `EXPO_PUBLIC_SUPABASE_URL: $STAGING_SUPABASE_URL`
          # mem-bundle teks `$STAGING_SUPABASE_URL` apa adanya. Bundel staging membawa
          # nilai itu sejak 2026-07-21 dan web merender halaman putih tanpa error konsol
          # selama 56 commit, sementara job ini terus melaporkan sukses. Jangan
          # dikembalikan ke bentuk `environment:`.
          name: Export web bundle
          command: |
            set -eu
            : "${STAGING_SUPABASE_URL:?STAGING_SUPABASE_URL belum di-set di CircleCI project env vars}"
            : "${STAGING_SUPABASE_ANON_KEY:?STAGING_SUPABASE_ANON_KEY belum di-set di CircleCI project env vars}"
            EXPO_PUBLIC_SUPABASE_URL="$STAGING_SUPABASE_URL" \
            EXPO_PUBLIC_SUPABASE_ANON_KEY="$STAGING_SUPABASE_ANON_KEY" \
              npx expo export --platform web
      - run:
          # Gate build-time: bundel hasil export TIDAK BOLEH memuat nama variabel shell.
          # `env.ts` sudah menolaknya saat runtime, tapi kegagalan runtime di browser tidak
          # terlihat CI — ini menjadikannya kegagalan build yang keras.
          name: Verifikasi bundel tidak memuat env yang belum terinterpolasi
          command: |
            set -eu
            if grep -rlF '$STAGING_SUPABASE' dist/ >/dev/null 2>&1; then
              echo "GAGAL: bundel memuat literal \$STAGING_SUPABASE* — env tidak terinterpolasi." >&2
              grep -rlF '$STAGING_SUPABASE' dist/ >&2
              exit 1
            fi
            echo "OK: nol literal \$STAGING_SUPABASE* di dist/."
      - run:
          name: Deploy to EAS Hosting (staging alias)
          command: eas deploy --alias staging --non-interactive
      - run:
          # Smoke check pasca-deploy. `eas deploy` sukses hanya berarti unggahan selesai —
          # bukan bahwa halamannya hidup. Selama 56 commit tidak ada yang menangkap staging
          # merender putih karena job ini berhenti di langkah sebelumnya.
          #
          # BATAS YANG JUJUR: `curl` tidak mengeksekusi JavaScript, jadi langkah ini TIDAK
          # membuktikan aplikasi merender. Yang dibuktikan: URL balas 200, tag bundel ada,
          # bundel yang BENAR-BENAR DILAYANI terunduh, dan isinya bersih dari env yang tak
          # terinterpolasi. Itu menutup kelas kegagalan yang kita alami — dan hanya itu.
          # Untuk membuktikan render dibutuhkan browser headless di CI; kalau kelak ada
          # kegagalan render yang lolos gate ini, itu jalur peningkatannya.
          name: Smoke check staging (200 + bundel live bersih)
          command: |
            set -eu
            URL="https://staging.rencanapp.com"
            # Retry: alias EAS + cache Cloudflare butuh beberapa detik untuk menunjuk build baru.
            for i in 1 2 3 4 5 6; do
              CODE=$(curl -s -o /tmp/staging.html -w '%{http_code}' "$URL" || echo 000)
              [ "$CODE" = "200" ] && break
              echo "percobaan $i: HTTP $CODE, tunggu 10s"; sleep 10
            done
            [ "$CODE" = "200" ] || { echo "GAGAL: $URL balas HTTP $CODE" >&2; exit 1; }

            BUNDLE=$(grep -oE '/_expo/static/js/web/[^"]+\.js' /tmp/staging.html | head -1)
            [ -n "$BUNDLE" ] || { echo "GAGAL: tidak menemukan tag bundel di HTML" >&2; exit 1; }
            curl -sfo /tmp/bundle.js "$URL$BUNDLE" || { echo "GAGAL: bundel $BUNDLE tidak terunduh" >&2; exit 1; }
            if grep -qF '$STAGING_SUPABASE' /tmp/bundle.js; then
              echo "GAGAL: bundel LIVE memuat literal \$STAGING_SUPABASE*." >&2; exit 1
            fi
            echo "OK: $URL 200, bundel $BUNDLE bersih."

workflows:
  version: 2

  # CI pada setiap push ke branch mana pun. CircleCI tidak punya konsep
  # `pull_request` trigger native seperti GH Actions — semua push masuk workflow.
  # Deploy-staging di-filter branches: only staging.
  #
  # Filter `only: [main, staging]` pada 3 job gate sempat dipasang untuk hemat
  # kuota (2026-07-21), lalu DICABUT 2026-07-22 karena efek sampingnya: PR ke
  # staging jadi nol check — bukan merah, melainkan tidak dijalankan sama sekali
  # — sehingga tidak ada gate CI sebelum merge. Itu bertentangan dengan catatan
  # di kepala file ini ("deploy-staging quality/db-contract re-run: sudah sebagai
  # gate PR"), yang mengandaikan ketiganya memang jalan di PR.
  #
  # Konsekuensi yang diterima sadar: konsumsi kuota naik karena setiap push ke
  # branch fitur ikut menjalankan ketiganya. Pre-push hook lokal (.githooks/
  # pre-push) TIDAK menggantikan ini — ia bisa dilewati `--no-verify` dan tidak
  # menjalankan db-contract. Kalau kuota kembali jadi masalah, opsi yang lebih
  # tepat daripada memfilter branch: aktifkan "Only build pull requests" di
  # CircleCI Advanced settings (butuh GitHub App integration), supaya push WIP
  # tidak memicu build tapi PR tetap ter-gate.
  ci:
    jobs:
      - quality
      - rename-guard
      - db-contract
      - deploy-staging:
          requires:
            - quality
            - rename-guard
            - db-contract
          filters:
            branches:
              only: staging
