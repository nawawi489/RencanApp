name: PR Preview

# Setiap PR ke main: jalankan cek mutu, lalu build internal untuk diuji di device.
on:
  pull_request:
    branches: [main]

# EAS Workflows belum mendukung custom concurrency group — wajib placeholder ini
# (docs.expo.dev/eas/workflows/syntax). Field-nya cancel_in_progress (underscore), nilai true.
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  checks:
    name: Lint, types & tests
    steps:
      - uses: eas/checkout
      # `npm install` (bukan step bawaan `eas/install_node_modules` yang pakai `npm ci`):
      # optional wasm dep (@emnapi/*, lightningcss) resolve berbeda antar-OS, jadi lockfile
      # yang di-generate di dev Windows tidak lolos `npm ci` strict di runner Linux EAS.
      # Selaras dengan strategi di `.github/workflows/ci.yml`.
      - name: Install node modules
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm run test:ci

  build:
    name: Build preview (internal)
    needs: [checks]
    type: build
    params:
      # Android dulu: keystore di-generate otomatis EAS, tanpa Apple Developer account.
      # Tambah iOS (platform: all) setelah kredensial Apple di-setup via `eas credentials`.
      platform: android
      profile: preview
