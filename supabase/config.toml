# Minimal config untuk Supabase CLI — dibutuhkan `supabase link` / `functions serve|deploy`.
# project_id "supabase" mengikuti nama container stack lokal existing (supabase_db_supabase).
project_id = "supabase"

# create-user memverifikasi JWT + permission pemanggil di dalam function;
# verify_jwt gateway tetap aktif sebagai lapisan pertama.
[functions.create-user]
verify_jwt = true

# push-fanout drainer dipanggil pg_cron via net.http_post dengan SERVICE_ROLE key —
# tidak ada JWT user context, jadi gateway verify_jwt harus off. Otorisasi via
# SUPABASE_SERVICE_ROLE_KEY di header Authorization.
[functions.push-fanout]
verify_jwt = false

# Analytics (Logflare) butuh Docker daemon TCP di :2375 (Windows-specific).
# Untuk dev lokal disable — app tidak butuh analytics, dan enabling TCP daemon
# adalah security risk yang tidak sepadan untuk local-only setup.
[analytics]
enabled = false
