name: Deploy Staging

# Deploy staging berjalan di GitHub Actions. Dikembalikan dari CircleCI setelah
# repo dijadikan publik 2026-07-25 (Actions gratis untuk repo publik). CircleCI
# job `deploy-staging` dipensiunkan agar tidak terjadi double-deploy ke EAS.
# `workflow_dispatch` dipertahankan untuk deploy manual bila perlu.
on:
  push:
    branches: [staging]
    paths:
      - 'mobile/**'
      - 'supabase/**'
      - 'scripts/ci/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

# Job quality + db-contract dihapus. Sudah dijalankan sebagai gate PR di ci.yml —
# merge ke staging pakai squash/rebase, isi commit-nya adalah yang sudah verified
# di PR (typically 5-10 menit sebelumnya). Re-run di sini = ~10 menit tanpa
# informasi baru. Deploy langsung dari commit yang sudah green.
#
# Risiko: kalau ada bypass merge (admin override, direct push tanpa PR), deploy
# jalan tanpa gate CI. Backstop = branch protection GitHub (aktif sejak
# 2026-07-27 pasca repo publik; sprint S1-3): required checks Lint/types/tests
# + DB contract + Rename guard, force-push diblokir.
#
# Pipeline (S1-2, 2026-07-27):
#   1. db-push (env: staging-db, manual approval)  → apply migrasi
#   2. deploy (needs: db-push)                     → export+eas deploy
#   3. smoke  (needs: deploy)                      → verify bundle serves real host
# Bila db-push gagal atau ditolak, deploy klien TIDAK jalan. Ini menutup akar
# masalah S1-1: staging melayani klien yang memanggil RPC yang belum di-apply
# ke DB.
jobs:
  db-push:
    name: Apply Supabase migrations (staging)
    runs-on: ubuntu-latest
    # environment `staging-db` mengunci step ini di belakang manual approval +
    # secret SUPABASE_ACCESS_TOKEN/SUPABASE_DB_PASSWORD/SUPABASE_PROJECT_REF.
    # Konfigurasi di Settings → Environments → staging-db.
    environment: staging-db
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # --include-all mem-forward semua migrasi lokal yang belum di ledger.
        # Ledger staging saat ini punya gap historis (0080, 0082, 0083, 0085-0088);
        # tanpa flag ini push akan protes "found local migration files to be inserted
        # before the last migration on remote database". Gap itu sengaja diterima —
        # rekonsiliasi ledger dijadwalkan di S5-3.
        run: supabase db push --include-all --linked

  deploy:
    name: Export & deploy to EAS Hosting
    runs-on: ubuntu-latest
    needs: db-push
    env:
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      # S5-6 — Sentry release/dist tag di-bake ke bundel via env EXPO_PUBLIC_*.
      # `release` = commit SHA (stabil lintas re-run workflow); `dist` = run_id
      # (membedakan re-run atas commit sama). Sourcemap upload di step berikut
      # WAJIB memakai nilai release yg sama biar stacktrace ter-symbolicate.
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
      EXPO_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
      EXPO_PUBLIC_SENTRY_DIST: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # S9-7: pakai `npm ci` untuk lock-strict install. Prasyarat: lockfile
      # sudah di-regen di runner Linux via `regen-lockfile.yml` (workflow_dispatch)
      # setiap dependency change dari dev Windows.
      - run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        # S9-7: eas-cli dipin ke rentang major agar deploy staging reproducible.
        # Bump minor/patch dilakukan sadar via commit yang mengubah versi ini.
        run: npm install -g eas-cli@^16

      - name: Export web bundle
        # Sourcemap wajib ada di dist/ agar upload di step berikut punya
        # sesuatu untuk ditunjuk. `--source-maps` tersedia di expo-cli >= v50.
        run: npx expo export --platform web --source-maps

      # S5-6 — upload sourcemap web bundle ke Sentry supaya stacktrace
      # produksi bisa ter-symbolicate. Skip gracefully bila SENTRY_AUTH_TOKEN
      # belum di-set (owner belum provisioning Sentry project); staging tetap
      # deploy, hanya symbolication yang absen. Setelah owner isi 3 secret ini
      # step-nya jalan otomatis di deploy berikutnya.
      - name: Upload sourcemaps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_DIST: ${{ github.run_id }}
        run: |
          npx --yes @sentry/cli@2 releases new "$SENTRY_RELEASE"
          npx --yes @sentry/cli@2 releases files "$SENTRY_RELEASE" \
            upload-sourcemaps ./dist --dist "$SENTRY_DIST" --url-prefix '~/'
          npx --yes @sentry/cli@2 releases finalize "$SENTRY_RELEASE"

      - name: Deploy to EAS Hosting (staging alias)
        run: eas deploy --alias staging --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  smoke:
    name: Smoke check (staging serves real bundle)
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify bundle carries real Supabase host
        # scripts/ci/smoke-check-staging.sh menutup kelas kegagalan "eas deploy sukses
        # tapi bundel putih" (deploy #402 era CircleCI). Menyambung ulang script yang
        # sudah ada tapi tak dipanggil workflow mana pun sejak migrasi dari CircleCI
        # (audit S1-8).
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: bash scripts/ci/smoke-check-staging.sh
