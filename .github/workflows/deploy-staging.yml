name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  quality:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm install --no-audit --no-fund

      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:ci

  db-contract:
    name: DB contract tests (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        # supabase/ and scripts/ live at the repo root, not in mobile/.
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Start Supabase stack
        # Applies every migration in order + creates the auth schema. No seed
        # runs; the runner applies supabase/tests/_fixtures.sql. Staging must not
        # deploy on a red DB contract (0049/0067-class RLS regressions, etc.).
        run: supabase start

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run DB contract suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/ci/run-db-contract-tests.sh

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Export & deploy to EAS Hosting
    needs: [quality, db-contract]
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_SUPABASE_URL: https://fhnqwytqprsptjshoxfn.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm install --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Export web bundle
        run: npx expo export --platform web

      - name: Deploy to EAS Hosting (staging alias)
        run: eas deploy --alias staging --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
