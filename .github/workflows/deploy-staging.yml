name: Deploy Staging

# Trigger di-scope ke path yang benar-benar mengubah bundle web / migrasi DB.
# Edit dokumentasi (wiki/, docs/, specs/, prd/, *.md di root) TIDAK men-deploy —
# bundle web-nya identik sebelum & sesudah edit dokumen. Menghemat ~13 menit
# per commit doc-only.
on:
  push:
    branches: [staging]
    paths:
      - 'mobile/**'
      - 'supabase/**'
      - 'scripts/ci/**'
      - '.github/workflows/deploy-staging.yml'

concurrency:
  group: deploy-staging
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

# Job quality + db-contract dihapus. Sudah dijalankan sebagai gate PR di ci.yml —
# merge ke staging pakai squash/rebase, isi commit-nya adalah yang sudah verified
# di PR (typically 5-10 menit sebelumnya). Re-run di sini = ~10 menit tanpa
# informasi baru. Deploy langsung dari commit yang sudah green.
#
# Risiko: kalau ada bypass merge (admin override, direct push tanpa PR), deploy
# jalan tanpa gate CI. Untuk repo satu-orang dengan disiplin PR-only, risiko rendah.
# Kalau di kemudian hari perlu backstop, tambahkan branch protection rule
# "Require status checks to pass before merging" di GitHub Settings.
jobs:
  deploy:
    name: Export & deploy to EAS Hosting
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm install --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Export web bundle
        run: npx expo export --platform web

      - name: Deploy to EAS Hosting (staging alias)
        run: eas deploy --alias staging --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
