name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  # Menentukan apakah push ini menyentuh DB. Dipakai untuk membedakan
  # "db-contract di-skip karena tak relevan" dari "db-contract gagal" — beda yang
  # menentukan apakah deploy boleh lanjut (lihat kondisi di job `deploy`).
  #
  # Arah gagalnya sengaja "anggap menyentuh DB": kalau base sha tak terjangkau,
  # `db` di-set true sehingga gate DB tetap dipasang. Menahan deploy lebih aman
  # daripada melepasnya diam-diam.
  changes:
    name: Detect changed areas
    runs-on: [self-hosted, wsl-ubuntu]
    defaults:
      run:
        working-directory: .
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="$PUSH_BASE"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base sha tidak terjangkau ($BASE) → anggap menyentuh DB"
            echo "db=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff --name-only "$BASE" HEAD)
          echo "File berubah:"; echo "$FILES" | sed 's/^/  /'

          # `.github/**` SENGAJA TIDAK ikut memicu gate DB di sini — berbeda dari
          # ci.yml. Di ci.yml alasannya kuat: perubahan workflow harus diuji oleh
          # workflow itu sendiri. Di workflow deploy, memicu DB contract karena edit
          # workflow memberi NOL manfaat keamanan (edit YAML tidak bisa menyebabkan
          # regresi RLS) tetapi memblokir deploy — dan selama menit hosted terblokir
          # itu berarti perbaikan workflow tidak akan pernah bisa ter-deploy, termasuk
          # perbaikan ini sendiri. Gate hanya untuk yang benar-benar mengubah kontrak DB.
          if echo "$FILES" | grep -qE '^(supabase/|scripts/ci/)'; then DB=true; else DB=false; fi
          echo "db=$DB" >> "$GITHUB_OUTPUT"
          echo "→ db-contract=$DB"

  quality:
    name: Lint, types & tests
    runs-on: [self-hosted, wsl-ubuntu]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # `cache: npm` sengaja tidak dipakai di runner self-hosted — step simpan
          # cache mengunggah ~/.npm (177 MB) ke layanan cache GitHub dan teramati
          # menggantung sampai run harus dibatalkan. Di mesin yang sama ~/.npm sudah
          # persisten antar-run. Lihat wiki/entities/self-hosted-runner.md.

      - run: npm install --no-audit --no-fund

      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:ci

  db-contract:
    name: DB contract tests (Postgres)
    needs: changes
    if: needs.changes.outputs.db == 'true'
    # TETAP di runner GitHub, tidak dipindah ke self-hosted. Job ini menjalankan
    # `supabase start` lalu `supabase stop --no-backup`, sementara runner self-hosted
    # berbagi daemon Docker dengan mesin developer yang biasanya menjalankan stack
    # Supabase lokal di port sama (54321/54322) — memindahkannya bisa merobohkan
    # stack dev developer sendiri.
    runs-on: ubuntu-latest
    defaults:
      run:
        # supabase/ and scripts/ live at the repo root, not in mobile/.
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Start Supabase stack
        # Applies every migration in order + creates the auth schema. No seed
        # runs; the runner applies supabase/tests/_fixtures.sql. Staging must not
        # deploy on a red DB contract (0049/0067-class RLS regressions, etc.).
        run: supabase start

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run DB contract suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/ci/run-db-contract-tests.sh

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Export & deploy to EAS Hosting
    needs: [changes, quality, db-contract]
    # Gate DB TIDAK dilonggarkan — hanya dipertajam supaya membedakan "tak relevan"
    # dari "gagal":
    #   - push tidak menyentuh DB   → db-contract `skipped` → deploy lanjut
    #   - push menyentuh DB & hijau → deploy lanjut
    #   - push menyentuh DB & merah → deploy TERTAHAN (termasuk ketika merahnya
    #     karena menit hosted terblokir — menahan deploy memang perilaku yang benar
    #     di situ; jangan dilonggarkan demi "biar jalan")
    #
    # `always()` wajib, sebab tanpa itu satu `needs` yang skipped ikut membuat job
    # ini skipped. Tapi `always()` juga mem-bypass gerbang bawaan `needs`, jadi
    # `quality` HARUS dicek eksplisit — tanpa baris itu deploy bisa jalan di atas
    # test yang merah.
    # `changes` juga wajib sukses: bila ia gagal, `db-contract` ikut ter-skip karena
    # output-nya kosong — dan tanpa cek ini gate DB akan lenyap diam-diam persis
    # ketika kita paling tidak tahu apa yang berubah.
    if: |
      always()
      && needs.changes.result == 'success'
      && needs.quality.result == 'success'
      && needs.db-contract.result != 'failure'
      && needs.db-contract.result != 'cancelled'
    runs-on: [self-hosted, wsl-ubuntu]
    env:
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_SUPABASE_URL: https://fhnqwytqprsptjshoxfn.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Lihat catatan cache di job `quality`.

      - run: npm install --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Export web bundle
        run: npx expo export --platform web

      - name: Deploy to EAS Hosting (staging alias)
        run: eas deploy --alias staging --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
