name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  quality:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm install --no-audit --no-fund

      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:ci

  deploy:
    name: Export & deploy to EAS Hosting
    needs: quality
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_SUPABASE_URL: https://fhnqwytqprsptjshoxfn.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm install --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Export web bundle
        run: npx expo export --platform web

      - name: Deploy to EAS Hosting (staging alias)
        run: eas deploy --alias staging --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
