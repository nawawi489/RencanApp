name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

# Batalkan run lama untuk ref yang sama saat ada push baru.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Aplikasi Expo berada di sub-folder mobile/ (monorepo).
    working-directory: mobile

jobs:
  # Anggaran menit Actions repo privat = 2.000/bulan (paket Free). Satu run penuh
  # memakan ~10 menit (quality 6,9 + db-contract 2,9 + rename guard 0,3), sementara
  # sebagian besar PR di repo ini hanya menyentuh wiki/spec — membayar 10 menit untuk
  # nol risiko regresi. Job murah ini (~0,2 menit) memutuskan dua job mahal mana yang
  # perlu jalan.
  #
  # Arah gagalnya SENGAJA "jalankan semuanya": kalau base sha tidak terjangkau atau
  # diff gagal, kedua output di-set true. Lebih baik boros menit daripada meloloskan
  # regresi diam-diam.
  #
  # Rename guard TIDAK ikut digating — ia memindai `wiki`, `specs`, dan `DESIGN.md`
  # (lihat ROOTS di scripts/ci/no-old-names.sh), jadi justru PR wiki-only yang paling
  # perlu dijaga olehnya. Biayanya 0,3 menit; tidak sepadan untuk dioptimasi.
  changes:
    name: Detect changed areas
    runs-on: [self-hosted, wsl-ubuntu]
    defaults:
      run:
        working-directory: .
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Butuh riwayat agar base sha PR terjangkau untuk di-diff.
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BASE"; fi

          # Base tak dikenal (mis. push pertama ke branch, force-push) → jalankan semua.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base sha tidak terjangkau ($BASE) → jalankan semua job"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "db=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff --name-only "$BASE" HEAD)
          echo "File berubah:"; echo "$FILES" | sed 's/^/  /'

          # .github/** ikut memicu keduanya: perubahan workflow harus diuji oleh
          # workflow itu sendiri, bukan di-skip oleh dirinya.
          if echo "$FILES" | grep -qE '^(mobile/|\.github/)'; then MOBILE=true; else MOBILE=false; fi
          if echo "$FILES" | grep -qE '^(supabase/|scripts/ci/|\.github/)'; then DB=true; else DB=false; fi

          echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"
          echo "db=$DB" >> "$GITHUB_OUTPUT"
          echo "→ quality=$MOBILE db-contract=$DB"

  no-old-names:
    name: Rename guard (V1.8.3)
    runs-on: [self-hosted, wsl-ubuntu]
    defaults:
      run:
        # Run at repo root, not mobile/, since the guard scans multiple trees.
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ripgrep
        # Di runner self-hosted `rg` sudah terpasang di image distro, dan user `runner`
        # SENGAJA tidak diberi sudo tanpa password — memberi root tanpa password berarti
        # workflow apa pun bisa jadi root di mesin developer. Jadi: pakai yang sudah ada,
        # apt-get hanya sebagai fallback (mis. bila job ini kembali ke runner GitHub).
        run: command -v rg >/dev/null || sudo apt-get install -y ripgrep

      - name: Grep-guard legacy identifiers
        # Fails if kpi_area_id, kpi_areas, action_plan_instances, KpiArea, etc.
        # reappear outside historical migrations/tests/specs. See
        # scripts/ci/no-old-names.sh EXCLUDES for the allowlist policy.
        run: bash scripts/ci/no-old-names.sh

  quality:
    name: Lint, types & tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: [self-hosted, wsl-ubuntu]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # `cache: npm` SENGAJA tidak dipakai di runner self-hosted. Cache Actions
          # menambah satu langkah simpan di akhir job yang mengunggah ~/.npm (177 MB)
          # ke layanan cache GitHub — teramati menggantung sampai job harus dibatalkan,
          # sementara load average runner hanya 0,33 (bukan CPU-bound, melainkan
          # menunggu layanan yang ikut terdampak blokir billing).
          #
          # Di mesin yang sama sepanjang waktu, ~/.npm memang sudah persisten antar-run,
          # jadi perjalanan pulang-pergi ke cache GitHub murni overhead. Bila job ini
          # suatu saat kembali ke runner GitHub, kembalikan `cache: npm` +
          # `cache-dependency-path: mobile/package-lock.json`.

      # Catatan anggaran: meng-cache node_modules pernah dipertimbangkan dan DITOLAK.
      # Diukur di runner: `Install dependencies` hanya 18 detik, sementara restore cache
      # node_modules Expo (ratusan MB) berpotensi lebih lama dari itu. Biaya job ini
      # ada di step Test (361 detik), bukan di install.
      - name: Install dependencies
        # npm install (bukan npm ci): proyek Expo/RN punya optional dep wasm (@emnapi/*,
        # lightningcss) yang resolusinya berbeda antar-OS, sehingga lock yang digenerate di
        # Windows tidak lolos `npm ci` strict di runner linux. `npm install` toleran & tetap deterministik via lock.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:ci

  db-contract:
    name: DB contract tests (Postgres)
    needs: changes
    if: needs.changes.outputs.db == 'true'
    # Jalan di runner self-hosted TANPA `supabase start`.
    #
    # `supabase start` tidak bisa dipakai di sini: ia mem-boot sembilan container dan
    # mengikat port 54321/54322 di host, sementara daemon Docker runner dibagi dengan
    # mesin developer yang biasanya sedang menjalankan stack dev di port yang sama —
    # `supabase stop` akan merobohkan stack itu berikut datanya.
    #
    # Gantinya: SATU container `supabase/postgres` tanpa port ter-publish sama sekali
    # (psql lewat `docker exec`), jadi mustahil bentrok. Yang tidak dibawa oleh image —
    # `auth.users` versi GoTrue, tabel `storage`, auth.uid() bentuk baru, dan default
    # privileges yang sudah diperketat — dipasang oleh scripts/ci/db-bootstrap.sql;
    # lihat file itu untuk alasan tiap bagian. Hasilnya diverifikasi identik dengan
    # baseline `supabase start` terakhir yang hijau: 29 passed, 0 failed.
    runs-on: [self-hosted, wsl-ubuntu]
    defaults:
      run:
        # supabase/ and scripts/ live at the repo root, not in mobile/.
        working-directory: .
    env:
      # Satu container per run+attempt agar dua run paralel tidak saling menghapus.
      RENCAN_CI_DB_NAME: rencan-ci-db-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Start Postgres + replay schema
        # Boots the container, applies the platform bootstrap, then replays every
        # supabase/migrations/*.sql in filename order — the same order
        # `supabase db reset` uses. No seed runs (there is no supabase/seed.sql);
        # the contract runner applies supabase/tests/_fixtures.sql itself.
        # This is where the ADR's "thick database" is exercised by CI.
        run: bash scripts/ci/start-db-container.sh

      - name: Run DB contract suite
        # Fails the job if any *.sql contract fails (ON_ERROR_STOP). Quarantined
        # *.wip.sql files are skipped — see supabase/tests/WIP_REPAIR_BACKLOG.md.
        # `psql` dipanggil DI DALAM container (RENCAN_DB_CONTAINER), jadi runner
        # tidak perlu punya postgresql-client terpasang.
        env:
          RENCAN_DB_CONTAINER: ${{ env.RENCAN_CI_DB_NAME }}
        run: bash scripts/ci/run-db-contract-tests.sh

      - name: Remove Postgres container
        if: always()
        run: docker rm -f "$RENCAN_CI_DB_NAME" || true
