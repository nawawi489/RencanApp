name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

# Batalkan run lama untuk ref yang sama saat ada push baru.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Aplikasi Expo berada di sub-folder mobile/ (monorepo).
    working-directory: mobile

jobs:
  no-old-names:
    name: Rename guard (V1.8.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Run at repo root, not mobile/, since the guard scans multiple trees.
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Grep-guard legacy identifiers
        # Fails if kpi_area_id, kpi_areas, action_plan_instances, KpiArea, etc.
        # reappear outside historical migrations/tests/specs. See
        # scripts/ci/no-old-names.sh EXCLUDES for the allowlist policy.
        run: bash scripts/ci/no-old-names.sh

  quality:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        # npm install (bukan npm ci): proyek Expo/RN punya optional dep wasm (@emnapi/*,
        # lightningcss) yang resolusinya berbeda antar-OS, sehingga lock yang digenerate di
        # Windows tidak lolos `npm ci` strict di runner linux. `npm install` toleran & tetap deterministik via lock.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:ci

  db-contract:
    name: DB contract tests (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        # supabase/ and scripts/ live at the repo root, not in mobile/.
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Start Supabase stack
        # `supabase start` boots the local stack (Postgres + auth schema) and
        # applies every migration in supabase/migrations in order — the same
        # path `db reset` uses. No seed runs (there is no supabase/seed.sql);
        # the contract runner applies supabase/tests/_fixtures.sql itself.
        # This is where the ADR's "thick database" is finally exercised by CI.
        run: supabase start

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run DB contract suite
        # Fails the job if any *.sql contract fails (ON_ERROR_STOP). Quarantined
        # *.wip.sql files are skipped — see supabase/tests/WIP_REPAIR_BACKLOG.md.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/ci/run-db-contract-tests.sh

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup
