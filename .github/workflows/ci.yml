name: CI

# CI berjalan di GitHub Actions. Repo dijadikan publik 2026-07-25 → Actions
# gratis tanpa batas menit untuk repo publik, jadi CI dikembalikan ke sini dari
# CircleCI (yang terblokir billing). `.circleci/config.yml` dipensiunkan.
# `workflow_dispatch` dipertahankan agar tetap bisa run manual dari UI Actions.
on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# Batalkan run lama untuk ref yang sama saat ada push baru.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Aplikasi Expo berada di sub-folder mobile/ (monorepo).
    working-directory: mobile

jobs:
  # Anggaran menit Actions repo privat = 2.000/bulan (paket Free). Satu run penuh
  # memakan ~10 menit (quality 6,9 + db-contract 2,9 + rename guard 0,3), sementara
  # sebagian besar PR di repo ini hanya menyentuh wiki/spec — membayar 10 menit untuk
  # nol risiko regresi. Job murah ini (~0,2 menit) memutuskan dua job mahal mana yang
  # perlu jalan.
  #
  # Arah gagalnya SENGAJA "jalankan semuanya": kalau base sha tidak terjangkau atau
  # diff gagal, kedua output di-set true. Lebih baik boros menit daripada meloloskan
  # regresi diam-diam.
  #
  # Rename guard TIDAK ikut digating — ia memindai `wiki`, `specs`, dan `DESIGN.md`
  # (lihat ROOTS di scripts/ci/no-old-names.sh), jadi justru PR wiki-only yang paling
  # perlu dijaga olehnya. Biayanya 0,3 menit; tidak sepadan untuk dioptimasi.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Butuh riwayat agar base sha PR terjangkau untuk di-diff.
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BASE"; fi

          # Base tak dikenal (mis. push pertama ke branch, force-push) → jalankan semua.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base sha tidak terjangkau ($BASE) → jalankan semua job"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "db=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff --name-only "$BASE" HEAD)
          echo "File berubah:"; echo "$FILES" | sed 's/^/  /'

          # .github/** ikut memicu keduanya: perubahan workflow harus diuji oleh
          # workflow itu sendiri, bukan di-skip oleh dirinya.
          # supabase/migrations/** juga memicu quality: dua tes drift jest mem-parse
          # migrasi saat runtime, jadi PR migrasi-only harus tetap menjalankan tes
          # jest — else drift tetap lolos (audit 2026-07-26).
          if echo "$FILES" | grep -qE '^(mobile/|\.github/|supabase/migrations/)'; then MOBILE=true; else MOBILE=false; fi
          if echo "$FILES" | grep -qE '^(supabase/|scripts/ci/|\.github/)'; then DB=true; else DB=false; fi

          echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"
          echo "db=$DB" >> "$GITHUB_OUTPUT"
          echo "→ quality=$MOBILE db-contract=$DB"

  no-old-names:
    name: Rename guard (V1.8.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Run at repo root, not mobile/, since the guard scans multiple trees.
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ripgrep
        run: command -v rg >/dev/null || sudo apt-get install -y ripgrep

      - name: Grep-guard legacy identifiers
        # Fails if kpi_area_id, kpi_areas, action_plan_instances, KpiArea, etc.
        # reappear outside historical migrations/tests/specs. See
        # scripts/ci/no-old-names.sh EXCLUDES for the allowlist policy.
        run: bash scripts/ci/no-old-names.sh

  quality:
    name: Lint, types & tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Catatan anggaran: meng-cache node_modules pernah dipertimbangkan dan DITOLAK.
      # Diukur: `Install dependencies` hanya ~18 detik, sementara restore cache
      # node_modules Expo (ratusan MB) berpotensi lebih lama dari itu. Biaya job ini
      # ada di step Test, bukan di install.
      - name: Install dependencies
        # npm install (bukan npm ci): proyek Expo/RN punya optional dep wasm (@emnapi/*,
        # lightningcss) yang resolusinya berbeda antar-OS, sehingga lock yang digenerate di
        # Windows tidak lolos `npm ci` strict di runner linux. `npm install` toleran & tetap deterministik via lock.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:ci

  db-contract:
    name: DB contract tests (Postgres)
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        # supabase/ and scripts/ live at the repo root, not in mobile/.
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Start Supabase stack
        # `supabase start` boots the local stack (Postgres + auth schema) and
        # applies every migration in supabase/migrations in order — the same
        # path `db reset` uses. No seed runs (there is no supabase/seed.sql);
        # the contract runner applies supabase/tests/_fixtures.sql itself.
        # This is where the ADR's "thick database" is finally exercised by CI.
        run: supabase start

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run DB contract suite
        # Fails the job if any *.sql contract fails (ON_ERROR_STOP). Quarantined
        # *.wip.sql files are skipped — see supabase/tests/WIP_REPAIR_BACKLOG.md.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/ci/run-db-contract-tests.sh

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup
