name: Regenerate lockfile (Linux)

# On-demand: regenerate mobile/package-lock.json di runner Linux dan buka PR.
# Perlu karena lockfile yang dihasilkan di Windows sering menahan versi optional
# wasm dep (@emnapi/*, lightningcss-*) yang berbeda dari resolusi Linux, sehingga
# `npm ci` di EAS Managed Build gagal dengan
# "Missing: @emnapi/core@x.y.z from lock file". Jalankan workflow ini setelah
# ada dependency change signifikan yang berasal dari dev Windows.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regen-lockfile
  cancel-in-progress: true

jobs:
  regen:
    name: Regenerate mobile/package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Regenerate lockfile
        working-directory: mobile
        # `--package-lock-only`: hanya update lockfile, tidak install node_modules.
        # Hapus lockfile lama supaya npm menyusun ulang resolusi dari nol.
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund

      - name: Create pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: chore/regen-lockfile
          delete-branch: true
          commit-message: "chore(deps): regenerate mobile/package-lock.json di Linux"
          title: "chore(deps): regenerate mobile/package-lock.json di Linux"
          body: |
            Regenerate `mobile/package-lock.json` di runner Ubuntu untuk memulihkan
            EAS PR Preview Build yang gagal dengan `Missing: @emnapi/core@... from
            lock file`.

            Dihasilkan otomatis dari workflow `Regenerate lockfile (Linux)`.
          labels: |
            dependencies
            ci
